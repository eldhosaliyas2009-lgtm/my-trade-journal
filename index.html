<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Trade Journal</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:20px 16px 18px;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0 0 4px}.sub{opacity:.75;font-size:13px}
nav{display:flex;gap:8px;margin-top:16px;overflow:auto}nav button{border:0;background:#374151;color:#fff;border-radius:10px;padding:9px 14px;white-space:nowrap}nav button.active{background:#fff;color:#111827}
main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #00000010}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
label{font-size:12px;font-weight:600;color:#4b5563;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font:inherit}textarea{min-height:80px;resize:vertical}
.full{grid-column:1/-1}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.light{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:600px){.statgrid{grid-template-columns:repeat(4,1fr)}}.stat{padding:14px;background:#f9fafb;border-radius:12px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:#6b7280}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 6px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}th{color:#6b7280}.scroll{overflow:auto}.profit{color:#047857;font-weight:700}.loss{color:#b91c1c;font-weight:700}.hidden{display:none!important}.muted{color:#6b7280;font-size:13px}.field{background:#f9fafb;padding:10px;border-radius:10px}.field .remove{float:right;border:0;background:none;color:#b91c1c}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}

.chart{height:220px;width:100%;display:block}
.kpi{font-size:12px;color:#6b7280}.barwrap{display:flex;align-items:end;gap:6px;height:180px;padding:10px 4px;border-bottom:1px solid #e5e7eb}
.bar{flex:1;min-width:8px;background:#111827;border-radius:5px 5px 0 0;position:relative}.bar.neg{background:#b91c1c}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;white-space:nowrap}
@media(max-width:500px){.barwrap{gap:3px}.bar span{font-size:8px}}

</head>
<body>
<header>
<h1>📒 My Trade Journal</h1><div class="sub">Custom fields • P&L • setups • mistakes</div>
<nav>
<button class="active" data-page="dashboard">Dashboard</button>
<button data-page="trades">Trades</button>
<button data-page="add">+ Add Trade</button>
<button data-page="settings">Custom Fields</button>
</nav>
</header>
<main>
<section id="dashboard" class="page">
<div class="card"><h2>Dashboard</h2><div class="statgrid">
<div class="stat"><b id="sNet">₹0</b><span>Net P&L</span></div>
<div class="stat"><b id="sTrades">0</b><span>Trades</span></div>
<div class="stat"><b id="sWin">0%</b><span>Win Rate</span></div>
<div class="stat"><b id="sAvg">₹0</b><span>Avg / Trade</span></div>
</div></div>
<div class="card"><h3>P&L Overview</h3><div id="pnlChart" class="barwrap"></div><div class="muted" style="margin-top:28px">Each bar = one trade, newest on the right.</div></div>
<div class="card"><h3>Recent trades</h3><div id="recent" class="scroll"></div></div>
</section>

<section id="trades" class="page hidden">
<div class="card"><div class="row"><input id="search" placeholder="Search stock / setup..." style="flex:1;min-width:180px"><select id="typeFilter"><option value="">All types</option><option>Intraday</option><option>Swing</option><option>Position</option></select></div></div>
<div class="card"><div id="tradeTable" class="scroll"></div></div>
</section>

<section id="add" class="page hidden">
<div class="card"><h2 id="formTitle">Add Trade</h2><form id="tradeForm"><div class="grid">
<div><label>Stock</label><input id="stock" required placeholder="e.g. SAIL"></div>
<div><label>Trade Type</label><select id="type"><option>Intraday</option><option>Swing</option><option>Position</option></select></div>
<div><label>Buy / Entry Price</label><input id="entry" type="number" step="any" required></div>
<div><label>Quantity</label><input id="qty" type="number" step="any" required></div>
<div><label>Target</label><input id="target" type="number" step="any"></div>
<div><label>Stop Loss</label><input id="sl" type="number" step="any"></div>
<div><label>Exit Price</label><input id="exit" type="number" step="any"></div>
<div><label>Total Charges</label><input id="charges" type="number" step="any" value="0"></div>
<div><label>Entry Date</label><input id="date" type="date"></div>
<div><label>Exit Date</label><input id="exitDate" type="date"></div>
<div class="full"><label>Notes</label><textarea id="notes" placeholder="Why did you enter/exit?"></textarea></div>
<div id="customInputs" class="full"></div>
</div><div class="row" style="margin-top:14px"><button class="btn primary" type="submit">Save Trade</button><button class="btn light" type="button" onclick="showPage('dashboard')">Cancel</button></div></form></div>
</section>

<section id="settings" class="page hidden">
<div class="card"><h2>Journal Settings</h2><p class="muted">Your fields are saved on this device. Use Backup regularly.</p><div class="row"><button class="btn light" onclick="exportData()">Export Backup</button><button class="btn light" onclick="document.getElementById('importFile').click()">Restore Backup</button></div></div>
<div class="card"><h2>Custom Fields</h2><p class="muted">Create your own fields. They will appear in every new trade.</p>
<div id="fields"></div>
<div class="grid" style="margin-top:12px">
<div><label>Field name</label><input id="newName" placeholder="e.g. Nifty Trend"></div>
<div><label>Field type</label><select id="newType"><option value="text">Text</option><option value="select">Dropdown</option><option value="number">Number</option><option value="checkbox">Checkbox</option></select></div>
<div id="optionsWrap" class="full"><label>Dropdown options (comma separated)</label><input id="newOptions" placeholder="Bullish, Bearish, Sideways"></div>
</div><button class="btn primary" style="margin-top:10px" onclick="addField()">+ Add Custom Field</button></div>
<div class="card"><h3>Backup</h3><div class="row"><button class="btn light" onclick="exportData()">Export JSON</button><button class="btn light" onclick="document.getElementById('importFile').click()">Import JSON</button><input id="importFile" type="file" accept=".json" class="hidden" onchange="importData(event)"></div></div>
</section>
</main>

<script>
const KEY='my_trade_journal_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"trades":[],"fields":[]}');
let editId=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();}
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(p).classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='add')buildCustomInputs();if(p==='settings')renderFields();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
function money(n){return '₹'+Number(n||0).toFixed(2)}
function net(t){if(t.exit===''||t.exit==null)return 0;return (Number(t.exit)-Number(t.entry))*Number(t.qty)-Number(t.charges||0)}
function renderChart(){
let el=$('pnlChart'); if(!el)return;
let ts=data.trades.slice(-20), vals=ts.map(net), max=Math.max(1,...vals.map(Math.abs));
el.innerHTML=vals.length?vals.map((v,i)=>`<div class="bar ${v<0?'neg':''}" title="${esc(ts[i].stock)}: ${money(v)}" style="height:${Math.max(4,Math.abs(v)/max*150)}px"><span>${i+1}</span></div>`).join(''):'<span class="muted">Add trades to see the chart.</span>';
}
function render(){
let ts=data.trades, total=ts.reduce((a,t)=>a+net(t),0), wins=ts.filter(t=>net(t)>0).length;
$('sNet').textContent=money(total);$('sNet').className=total>=0?'profit':'loss';$('sTrades').textContent=ts.length;$('sWin').textContent=(ts.length?Math.round(wins/ts.length*100):0)+'%';$('sAvg').textContent=money(ts.length?total/ts.length:0);
$('recent').innerHTML=table(ts.slice().reverse().slice(0,10));
renderTrades();renderChart();
}
function table(ts){if(!ts.length)return '<p class="muted">No trades yet.</p>';return '<table><thead><tr><th>Date</th><th>Stock</th><th>Type</th><th>Entry</th><th>Exit</th><th>Net P&L</th><th></th></tr></thead><tbody>'+ts.map(t=>{let p=net(t);return `<tr><td>${t.date||''}</td><td><b>${esc(t.stock)}</b></td><td>${t.type}</td><td>${t.entry}</td><td>${t.exit||'-'}</td><td class="${p>=0?'profit':'loss'}">${money(p)}</td><td><button class="btn light" onclick="editTrade('${t.id}')">Edit</button> <button class="btn danger" onclick="deleteTrade('${t.id}')">Delete</button></td></tr>`}).join('')+'</tbody></table>'}
function renderTrades(){let q=($('search')?.value||'').toLowerCase(), f=$('typeFilter')?.value||'';let ts=data.trades.filter(t=>(!q||(t.stock+' '+Object.values(t.custom||{}).join(' ')).toLowerCase().includes(q))&&(!f||t.type===f));$('tradeTable').innerHTML=table(ts)}
$('search').oninput=renderTrades;$('typeFilter').onchange=renderTrades;
function buildCustomInputs(vals={}){
$('customInputs').innerHTML=data.fields.map(f=>{let v=vals[f.id]??'';if(f.type==='select')return `<div class="field"><label>${esc(f.name)}</label><select data-cid="${f.id}"><option value="">Select</option>${f.options.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
if(f.type==='checkbox')return `<div class="field"><label class="check"><input type="checkbox" data-cid="${f.id}" ${v?'checked':''}> ${esc(f.name)}</label></div>`;
return `<div class="field"><label>${esc(f.name)}</label><input data-cid="${f.id}" type="${f.type}" value="${esc(v)}"></div>`}).join('')}
function getCustom(){let o={};document.querySelectorAll('#customInputs [data-cid]').forEach(e=>o[e.dataset.cid]=e.type==='checkbox'?e.checked:e.value);return o}
$('tradeForm').onsubmit=e=>{e.preventDefault();let t={id:editId||crypto.randomUUID(),stock:$('stock').value.trim(),type:$('type').value,entry:$('entry').value,qty:$('qty').value,target:$('target').value,sl:$('sl').value,exit:$('exit').value,charges:$('charges').value,date:$('date').value,exitDate:$('exitDate').value,notes:$('notes').value,custom:getCustom()};if(editId){let i=data.trades.findIndex(x=>x.id===editId);data.trades[i]=t}else data.trades.push(t);editId=null;e.target.reset();$('charges').value=0;save();showPage('dashboard')}
function editTrade(id){let t=data.trades.find(x=>x.id===id);editId=id;showPage('add');$('formTitle').textContent='Edit Trade';['stock','type','entry','qty','target','sl','exit','charges','date','exitDate','notes'].forEach(k=>$(k).value=t[k]??'');buildCustomInputs(t.custom||{})}
function deleteTrade(id){if(confirm('Delete this trade?')){data.trades=data.trades.filter(x=>x.id!==id);save()}}
function renderFields(){$('fields').innerHTML=data.fields.length?data.fields.map(f=>`<div class="field" style="margin-bottom:8px"><button class="remove" onclick="removeField('${f.id}')">✕</button><b>${esc(f.name)}</b><div class="muted">${f.type}${f.options?.length?' • '+f.options.join(', '):''}</div></div>`).join(''):'<p class="muted">No custom fields yet.</p>'}
function addField(){let name=$('newName').value.trim();if(!name)return;let f={id:crypto.randomUUID(),name,type:$('newType').value,options:$('newType').value==='select'?$('newOptions').value.split(',').map(x=>x.trim()).filter(Boolean):[]};data.fields.push(f);$('newName').value='';$('newOptions').value='';save();renderFields()}
function removeField(id){data.fields=data.fields.filter(f=>f.id!==id);data.trades.forEach(t=>{if(t.custom)delete t.custom[id]});save();renderFields()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='my-trade-journal-backup.json';a.click()}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.trades&&x.fields){data=x;save();alert('Backup imported.')}}catch(_){alert('Invalid backup file')}};r.readAsText(file)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
$('date').value=new Date().toISOString().slice(0,10);render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body></html>
